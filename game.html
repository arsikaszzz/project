<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Low-Poly Dino Run</title>
  <style>
    :root {
      --ui-fg: #fff8e7;
      --ui-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f7c59f;
      font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
      color: var(--ui-fg);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #score-panel {
      position: absolute;
      top: 24px;
      right: 28px;
      text-align: right;
      text-shadow: var(--ui-shadow);
      letter-spacing: 0.04em;
    }
    #score-label {
      font-size: 12px;
      font-weight: 600;
      opacity: 0.85;
      text-transform: uppercase;
    }
    #score {
      font-size: 44px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-top: 4px;
    }
    #best {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.8;
      margin-top: 6px;
      letter-spacing: 0.06em;
    }
    #title-panel {
      position: absolute;
      top: 22px;
      left: 28px;
      text-shadow: var(--ui-shadow);
    }
    #title-panel h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    #title-panel p {
      margin: 4px 0 0;
      font-size: 12px;
      opacity: 0.85;
      letter-spacing: 0.06em;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: radial-gradient(ellipse at center,
        rgba(20, 12, 30, 0.05) 0%,
        rgba(20, 12, 30, 0.45) 80%);
      pointer-events: auto;
      transition: opacity 0.3s ease;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .panel {
      background: rgba(255, 252, 240, 0.92);
      color: #2b1d3a;
      padding: 28px 36px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(20, 10, 30, 0.35);
      min-width: 260px;
    }
    .panel h2 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0.04em;
    }
    .panel p {
      margin: 4px 0;
      font-size: 14px;
      opacity: 0.8;
    }
    .key {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      background: #2b1d3a;
      color: #fff8e7;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin: 0 2px;
    }
    .panel .big-score {
      font-size: 42px;
      font-weight: 700;
      margin: 10px 0 0;
      color: #e15a4c;
    }
    @media (max-width: 540px) {
      #score { font-size: 34px; }
      #title-panel h1 { font-size: 18px; }
      .panel { padding: 22px 26px; min-width: 220px; }
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui">
    <div id="title-panel">
      <h1>DINO RUN</h1>
      <p>Low-Poly Endless Runner</p>
    </div>
    <div id="score-panel">
      <div id="score-label">Score</div>
      <div id="score">0</div>
      <div id="best">BEST 0</div>
    </div>
    <div id="overlay">
      <div class="panel" id="start-panel">
        <h2>Ready?</h2>
        <p>Press <span class="key">SPACE</span> or tap to jump</p>
        <p>Avoid the cacti and rocks</p>
        <p style="margin-top:14px;font-weight:700;color:#e15a4c">Press <span class="key">SPACE</span> to start</p>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // ------------------------------------------------------------------
    // Constants & palette
    // ------------------------------------------------------------------
    const PALETTE = {
      sky_top: 0x8ecae6,
      sky_bottom: 0xffd6a5,
      sun: 0xfff3b0,
      ground: 0xf6c177,
      ground_dark: 0xd49a5a,
      dune: 0xeab676,
      grass: 0xb7e4a3,
      cactus: 0x4caf6d,
      cactus_dark: 0x2e7d50,
      rock: 0x9b8aa3,
      rock_dark: 0x6e5f78,
      mountain: 0xc89bd6,
      mountain_far: 0x9a7fb0,
      cloud: 0xffffff,
      dino: 0x6cc551,
      dino_dark: 0x3f8f3a,
      dino_belly: 0xc8e6a0,
      dino_eye: 0x222222,
      dino_claw: 0xfff3b0,
    };

    const CONFIG = {
      laneWidth: 6,
      groundLength: 220,
      tileSize: 22,
      tileCount: 11, // groundLength / tileSize
      startSpeed: 18,
      maxSpeed: 60,
      speedRamp: 0.35, // units/sec^2
      gravity: -75,
      jumpVel: 26,
      doubleTapJumpWindow: 0.18,
      obstacleSpawnMin: 0.65,
      obstacleSpawnMax: 1.6,
      decorSpawnRate: 0.7,
      cloudCount: 14,
      mountainCount: 18,
    };

    // ------------------------------------------------------------------
    // Renderer / scene / camera
    // ------------------------------------------------------------------
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(PALETTE.sky_bottom, 90, 220);
    scene.background = makeSkyTexture();

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      400
    );
    const camRig = {
      offsetX: -8.5,
      offsetY: 6.2,
      offsetZ: -5.5,
      lookAhead: 11.0,
      lookY: 2.2,
    };
    // Dino starts at z=4, we just hard-code initial cam pos near it.
    camera.position.set(camRig.offsetX, camRig.offsetY, 4 + camRig.offsetZ);
    camera.lookAt(0, camRig.lookY, 4 + camRig.lookAhead);

    // ------------------------------------------------------------------
    // Lighting (soft, modern, slightly warm)
    // ------------------------------------------------------------------
    const hemi = new THREE.HemisphereLight(0xfff3d8, 0xc28a5a, 0.85);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1c1, 1.2);
    sun.position.set(-30, 50, -20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 120;
    sun.shadow.camera.left = -30;
    sun.shadow.camera.right = 30;
    sun.shadow.camera.top = 30;
    sun.shadow.camera.bottom = -30;
    sun.shadow.bias = -0.0008;
    scene.add(sun);
    // Lock the shadow camera to follow the runner
    sun.target.position.set(0, 0, 10);
    scene.add(sun.target);

    const fill = new THREE.DirectionalLight(0xb8d8ff, 0.25);
    fill.position.set(20, 20, -10);
    scene.add(fill);

    // ------------------------------------------------------------------
    // Sky texture (vibrant gradient)
    // ------------------------------------------------------------------
    function makeSkyTexture() {
      const c = document.createElement('canvas');
      c.width = 16;
      c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0.0, '#8ecae6');
      g.addColorStop(0.55, '#ffd6a5');
      g.addColorStop(1.0, '#f6c177');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 16, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      return tex;
    }

    // ------------------------------------------------------------------
    // Procedural ground tiles (low-poly, with subtle dunes)
    // ------------------------------------------------------------------
    const groundGroup = new THREE.Group();
    scene.add(groundGroup);

    function makeGroundTile() {
      const segs = 14;
      const geom = new THREE.PlaneGeometry(
        CONFIG.tileSize * 1.1,
        CONFIG.tileSize,
        segs,
        segs
      );
      geom.rotateX(-Math.PI / 2);
      const pos = geom.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        // Path corridor stays mostly flat; sides have rolling dunes
        const distFromPath = Math.abs(x);
        const corridor = THREE.MathUtils.smoothstep(distFromPath, 2.2, 9);
        const dune =
          Math.sin(x * 0.18 + z * 0.11) * 0.35 +
          Math.sin(x * 0.07 - z * 0.21 + 1.7) * 0.55;
        pos.setY(i, dune * corridor);
      }
      geom.computeVertexNormals();
      // Per-vertex color tint between two warm sand colors
      const colors = new Float32Array(pos.count * 3);
      const c1 = new THREE.Color(PALETTE.ground);
      const c2 = new THREE.Color(PALETTE.dune);
      for (let i = 0; i < pos.count; i++) {
        const t = THREE.MathUtils.clamp(pos.getY(i) * 0.6 + 0.5, 0, 1);
        const c = c1.clone().lerp(c2, t);
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }
      geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        flatShading: true,
        roughness: 1.0,
        metalness: 0.0,
      });

      const tile = new THREE.Mesh(geom, mat);
      tile.receiveShadow = true;
      return tile;
    }

    // Decorations (cacti / rocks / grass tufts) attached to a tile
    function decorateTile(tile) {
      const decor = new THREE.Group();
      tile.add(decor);
      tile.userData.decor = decor;
      const halfZ = CONFIG.tileSize / 2;
      const halfX = (CONFIG.tileSize * 1.1) / 2;
      const count = 14;
      for (let i = 0; i < count; i++) {
        const x = THREE.MathUtils.randFloatSpread(halfX * 1.9);
        const z = THREE.MathUtils.randFloatSpread(halfZ * 1.9);
        // Keep decorations off the runner's lane
        if (Math.abs(x) < 3.4) continue;
        const r = Math.random();
        let m;
        if (r < 0.45) m = makeCactus();
        else if (r < 0.75) m = makeRock();
        else m = makeGrassTuft();
        m.position.set(x, 0, z);
        m.rotation.y = Math.random() * Math.PI * 2;
        const s = 0.7 + Math.random() * 0.7;
        m.scale.setScalar(s);
        decor.add(m);
      }
      return decor;
    }

    // ------------------------------------------------------------------
    // Decorative meshes
    // ------------------------------------------------------------------
    const sharedGeom = {
      cactusBody: new THREE.CylinderGeometry(0.5, 0.55, 2.2, 6),
      cactusArm: new THREE.CylinderGeometry(0.28, 0.32, 1.0, 6),
      rock: new THREE.IcosahedronGeometry(0.9, 0),
      grass: new THREE.ConeGeometry(0.28, 0.6, 5),
      mountain: new THREE.ConeGeometry(8, 14, 4),
      cloud: new THREE.IcosahedronGeometry(1.2, 0),
    };
    const sharedMats = {
      cactus: new THREE.MeshStandardMaterial({
        color: PALETTE.cactus,
        flatShading: true,
        roughness: 0.85,
      }),
      cactusDark: new THREE.MeshStandardMaterial({
        color: PALETTE.cactus_dark,
        flatShading: true,
        roughness: 0.85,
      }),
      rock: new THREE.MeshStandardMaterial({
        color: PALETTE.rock,
        flatShading: true,
        roughness: 0.95,
      }),
      grass: new THREE.MeshStandardMaterial({
        color: PALETTE.grass,
        flatShading: true,
        roughness: 0.9,
      }),
      mountainNear: new THREE.MeshStandardMaterial({
        color: PALETTE.mountain,
        flatShading: true,
        roughness: 1.0,
      }),
      mountainFar: new THREE.MeshStandardMaterial({
        color: PALETTE.mountain_far,
        flatShading: true,
        roughness: 1.0,
      }),
      cloud: new THREE.MeshStandardMaterial({
        color: PALETTE.cloud,
        flatShading: true,
        roughness: 1.0,
        emissive: 0xffffff,
        emissiveIntensity: 0.05,
      }),
    };

    function makeCactus() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(sharedGeom.cactusBody, sharedMats.cactus);
      body.position.y = 1.1;
      body.castShadow = true;
      g.add(body);
      // Random side arms
      const arms = Math.random() < 0.5 ? 1 : 2;
      for (let i = 0; i < arms; i++) {
        const arm = new THREE.Mesh(sharedGeom.cactusArm, sharedMats.cactus);
        const side = i === 0 ? 1 : -1;
        arm.position.set(side * 0.5, 1.2 + Math.random() * 0.4, 0);
        arm.rotation.z = side * (0.5 + Math.random() * 0.2);
        const top = new THREE.Mesh(sharedGeom.cactusArm, sharedMats.cactus);
        top.position.set(0, 0.65, 0);
        arm.add(top);
        arm.castShadow = true;
        top.castShadow = true;
        g.add(arm);
      }
      return g;
    }

    function makeRock() {
      const g = new THREE.Group();
      const r = new THREE.Mesh(sharedGeom.rock, sharedMats.rock);
      r.position.y = 0.45;
      r.scale.set(1, 0.7, 1);
      r.castShadow = true;
      g.add(r);
      if (Math.random() < 0.5) {
        const r2 = new THREE.Mesh(sharedGeom.rock, sharedMats.rock);
        r2.position.set(0.6, 0.3, 0.2);
        r2.scale.setScalar(0.5);
        r2.castShadow = true;
        g.add(r2);
      }
      return g;
    }

    function makeGrassTuft() {
      const g = new THREE.Group();
      const blades = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < blades; i++) {
        const b = new THREE.Mesh(sharedGeom.grass, sharedMats.grass);
        b.position.set(
          (Math.random() - 0.5) * 0.4,
          0.3,
          (Math.random() - 0.5) * 0.4
        );
        b.rotation.z = (Math.random() - 0.5) * 0.4;
        g.add(b);
      }
      return g;
    }

    // Initial pool of tiles laid end-to-end along +Z
    const tiles = [];
    for (let i = 0; i < CONFIG.tileCount; i++) {
      const tile = makeGroundTile();
      tile.position.z = i * CONFIG.tileSize - CONFIG.tileSize;
      decorateTile(tile);
      groundGroup.add(tile);
      tiles.push(tile);
    }

    // ------------------------------------------------------------------
    // Distant mountains and clouds
    // ------------------------------------------------------------------
    const distant = new THREE.Group();
    scene.add(distant);
    for (let i = 0; i < CONFIG.mountainCount; i++) {
      const far = i % 2 === 0;
      const mat = far ? sharedMats.mountainFar : sharedMats.mountainNear;
      const m = new THREE.Mesh(sharedGeom.mountain, mat);
      const z = -30 + i * 14 + (Math.random() - 0.5) * 6;
      const x = (Math.random() - 0.5) * 220;
      // Push them off to the sides
      const sign = x >= 0 ? 1 : -1;
      m.position.set(sign * (35 + Math.random() * 50), 4, z);
      m.scale.set(
        0.8 + Math.random() * 0.7,
        0.7 + Math.random() * 0.9,
        0.8 + Math.random() * 0.7
      );
      m.rotation.y = Math.random() * Math.PI;
      distant.add(m);
    }

    const clouds = new THREE.Group();
    scene.add(clouds);
    for (let i = 0; i < CONFIG.cloudCount; i++) {
      const c = new THREE.Group();
      const lumps = 3 + Math.floor(Math.random() * 3);
      for (let j = 0; j < lumps; j++) {
        const lump = new THREE.Mesh(sharedGeom.cloud, sharedMats.cloud);
        lump.position.set(j * 1.2 - lumps * 0.5, Math.random() * 0.4, 0);
        lump.scale.setScalar(0.7 + Math.random() * 0.6);
        c.add(lump);
      }
      c.position.set(
        (Math.random() - 0.5) * 200,
        20 + Math.random() * 12,
        -40 + Math.random() * 200
      );
      c.scale.setScalar(1 + Math.random() * 1.2);
      clouds.add(c);
    }

    // ------------------------------------------------------------------
    // T-Rex character (low-poly, basic shapes)
    // ------------------------------------------------------------------
    const dino = new THREE.Group();
    scene.add(dino);

    const dinoMat = new THREE.MeshStandardMaterial({
      color: PALETTE.dino,
      flatShading: true,
      roughness: 0.7,
    });
    const dinoDarkMat = new THREE.MeshStandardMaterial({
      color: PALETTE.dino_dark,
      flatShading: true,
      roughness: 0.7,
    });
    const dinoBellyMat = new THREE.MeshStandardMaterial({
      color: PALETTE.dino_belly,
      flatShading: true,
      roughness: 0.8,
    });
    const eyeMat = new THREE.MeshStandardMaterial({
      color: PALETTE.dino_eye,
      flatShading: true,
      roughness: 0.4,
    });
    const clawMat = new THREE.MeshStandardMaterial({
      color: PALETTE.dino_claw,
      flatShading: true,
      roughness: 0.5,
    });

    function addBox(parent, w, h, d, x, y, z, mat = dinoMat) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = false;
      parent.add(m);
      return m;
    }

    // Body (slightly tapered using two boxes layered)
    const body = addBox(dino, 1.6, 1.6, 2.6, 0, 2.0, 0);
    addBox(body, 1.4, 0.8, 2.4, 0, -0.3, 0, dinoBellyMat);

    // Tail: stack of shrinking boxes
    const tail = new THREE.Group();
    body.add(tail);
    tail.position.set(0, 0.05, -1.1);
    let prev = tail;
    for (let i = 0; i < 4; i++) {
      const seg = new THREE.Group();
      prev.add(seg);
      seg.position.set(0, 0, -0.55);
      const s = 1 - i * 0.18;
      const segMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.0 * s, 1.0 * s, 1.05),
        i % 2 === 0 ? dinoMat : dinoDarkMat
      );
      segMesh.castShadow = true;
      seg.add(segMesh);
      prev = seg;
    }

    // Neck + head
    const neck = new THREE.Group();
    body.add(neck);
    neck.position.set(0, 0.55, 1.05);
    addBox(neck, 0.85, 1.0, 0.9, 0, 0.5, 0.0, dinoMat);
    const head = new THREE.Group();
    neck.add(head);
    head.position.set(0, 1.0, 0.3);
    addBox(head, 1.1, 1.0, 1.5, 0, 0, 0.4, dinoMat);
    // Snout
    addBox(head, 0.8, 0.55, 0.8, 0, -0.15, 1.2, dinoMat);
    // Belly under jaw
    addBox(head, 0.7, 0.25, 0.7, 0, -0.45, 1.05, dinoBellyMat);
    // Teeth row
    for (let i = -1; i <= 1; i++) {
      addBox(head, 0.12, 0.12, 0.12, i * 0.18, -0.32, 1.55, clawMat);
    }
    // Eyes
    addBox(head, 0.18, 0.22, 0.18, 0.42, 0.18, 0.55, eyeMat);
    addBox(head, 0.18, 0.22, 0.18, -0.42, 0.18, 0.55, eyeMat);
    // Eye whites (small offset boxes behind eye)
    addBox(head, 0.32, 0.32, 0.05, 0.42, 0.18, 0.46, dinoBellyMat);
    addBox(head, 0.32, 0.32, 0.05, -0.42, 0.18, 0.46, dinoBellyMat);
    // Eyebrow ridges
    addBox(head, 0.4, 0.12, 0.4, 0.42, 0.42, 0.55, dinoDarkMat);
    addBox(head, 0.4, 0.12, 0.4, -0.42, 0.42, 0.55, dinoDarkMat);

    // Arms (small T-Rex arms)
    const armL = new THREE.Group();
    body.add(armL);
    armL.position.set(0.85, 0.1, 0.7);
    addBox(armL, 0.3, 0.7, 0.3, 0, -0.35, 0, dinoMat);
    addBox(armL, 0.25, 0.12, 0.25, 0.05, -0.78, 0.05, clawMat);
    const armR = armL.clone();
    armR.position.x = -0.85;
    body.add(armR);

    // Legs
    const legL = new THREE.Group();
    body.add(legL);
    legL.position.set(0.5, -0.6, 0.0);
    const thighL = addBox(legL, 0.6, 1.2, 0.7, 0, -0.6, 0, dinoDarkMat);
    const shinL = new THREE.Group();
    thighL.add(shinL);
    shinL.position.set(0, -0.7, -0.1);
    addBox(shinL, 0.5, 1.0, 0.55, 0, -0.5, 0.05, dinoMat);
    addBox(shinL, 0.6, 0.18, 0.9, 0, -1.05, 0.25, dinoDarkMat);
    // Toe claws
    addBox(shinL, 0.12, 0.12, 0.12, 0.18, -1.05, 0.7, clawMat);
    addBox(shinL, 0.12, 0.12, 0.12, -0.18, -1.05, 0.7, clawMat);

    const legR = legL.clone(true);
    legR.position.x = -0.5;
    body.add(legR);

    // Helper to find the shin groups in cloned legs (nested under thigh)
    const shinR = legR.children[0].children[0];

    // Place dino in world
    dino.position.set(0, 0, 4);
    body.castShadow = true;

    // ------------------------------------------------------------------
    // Ground shadow plane (catches the sun shadow even when displaced)
    // ------------------------------------------------------------------
    const shadowPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.ShadowMaterial({ opacity: 0.18 })
    );
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = 0.001;
    shadowPlane.receiveShadow = true;
    scene.add(shadowPlane);

    // ------------------------------------------------------------------
    // Obstacles
    // ------------------------------------------------------------------
    const obstacles = [];
    function spawnObstacle() {
      const isRock = Math.random() < 0.35;
      const o = isRock ? makeObstacleRock() : makeObstacleCactus();
      const lane = (Math.random() - 0.5) * 1.8; // small lateral variation
      o.position.set(lane, 0, dino.position.z + 90 + Math.random() * 8);
      o.userData.radius = isRock ? 1.1 : 0.7;
      o.userData.height = isRock ? 1.0 : 2.4;
      o.userData.kind = isRock ? 'rock' : 'cactus';
      scene.add(o);
      obstacles.push(o);
    }

    function makeObstacleCactus() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.55, 0.65, 2.2 + Math.random() * 0.6, 6),
        sharedMats.cactus
      );
      body.position.y = 1.2;
      body.castShadow = true;
      g.add(body);
      const arms = 1 + Math.floor(Math.random() * 2);
      for (let i = 0; i < arms; i++) {
        const arm = new THREE.Mesh(
          new THREE.CylinderGeometry(0.3, 0.32, 0.9, 6),
          sharedMats.cactus
        );
        const side = Math.random() < 0.5 ? 1 : -1;
        arm.position.set(side * 0.55, 1.2 + Math.random() * 0.5, 0);
        arm.rotation.z = side * (0.55 + Math.random() * 0.15);
        const tip = new THREE.Mesh(
          new THREE.CylinderGeometry(0.28, 0.3, 0.7, 6),
          sharedMats.cactus
        );
        tip.position.set(0, 0.65, 0);
        arm.add(tip);
        arm.castShadow = true;
        tip.castShadow = true;
        g.add(arm);
      }
      // Slightly darker top cap
      const cap = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.55, 0),
        sharedMats.cactusDark
      );
      cap.position.y = 2.35;
      cap.castShadow = true;
      g.add(cap);
      return g;
    }

    function makeObstacleRock() {
      const g = new THREE.Group();
      const r = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.1, 0),
        sharedMats.rock
      );
      r.position.y = 0.7;
      r.scale.set(1.1, 0.85, 1.1);
      r.rotation.set(
        Math.random() * Math.PI,
        Math.random() * Math.PI,
        Math.random() * Math.PI
      );
      r.castShadow = true;
      g.add(r);
      const r2 = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.7, 0),
        sharedMats.rock
      );
      r2.position.set(0.7, 0.4, 0.3);
      r2.scale.setScalar(0.7);
      r2.castShadow = true;
      g.add(r2);
      return g;
    }

    // ------------------------------------------------------------------
    // Game state
    // ------------------------------------------------------------------
    const STATE = {
      running: false,
      gameOver: false,
      speed: CONFIG.startSpeed,
      score: 0,
      best: Number(localStorage.getItem('dinorun_best') || 0),
      jumpCount: 0,
      vy: 0,
      runT: 0,
      nextSpawn: 1.0,
      spawnTimer: 0,
      cameraShake: 0,
    };

    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const startPanel = document.getElementById('start-panel');
    bestEl.textContent = 'BEST ' + Math.floor(STATE.best);

    function setOverlay(html, visible = true) {
      startPanel.innerHTML = html;
      overlay.classList.toggle('hidden', !visible);
    }

    function startGame() {
      STATE.running = true;
      STATE.gameOver = false;
      STATE.speed = CONFIG.startSpeed;
      STATE.score = 0;
      STATE.jumpCount = 0;
      STATE.vy = 0;
      STATE.runT = 0;
      STATE.spawnTimer = 0;
      STATE.nextSpawn = 1.0;
      dino.position.y = 0;
      // remove all obstacles
      for (const o of obstacles) scene.remove(o);
      obstacles.length = 0;
      overlay.classList.add('hidden');
    }

    function endGame() {
      STATE.running = false;
      STATE.gameOver = true;
      STATE.cameraShake = 0.6;
      const final = Math.floor(STATE.score);
      if (final > STATE.best) {
        STATE.best = final;
        localStorage.setItem('dinorun_best', String(final));
      }
      bestEl.textContent = 'BEST ' + Math.floor(STATE.best);
      setOverlay(
        `<h2>Game Over</h2>
         <div class="big-score">${final}</div>
         <p>Best: ${Math.floor(STATE.best)}</p>
         <p style="margin-top:12px;font-weight:700;color:#2b1d3a">
           Press <span class="key">SPACE</span> to run again
         </p>`,
        true
      );
    }

    // ------------------------------------------------------------------
    // Input
    // ------------------------------------------------------------------
    function tryJump() {
      if (!STATE.running) {
        if (STATE.gameOver) {
          startGame();
        } else {
          startGame();
        }
        return;
      }
      // Allow a single jump (grounded) and a forgiving double jump
      if (dino.position.y <= 0.001) {
        STATE.vy = CONFIG.jumpVel;
        STATE.jumpCount = 1;
      } else if (STATE.jumpCount < 2) {
        STATE.vy = CONFIG.jumpVel * 0.85;
        STATE.jumpCount = 2;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        tryJump();
      }
    });
    window.addEventListener('pointerdown', (e) => {
      // ignore taps on overlay buttons themselves; we don't have any, so always jump
      tryJump();
    });

    // ------------------------------------------------------------------
    // Resize handling
    // ------------------------------------------------------------------
    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    onResize();

    // ------------------------------------------------------------------
    // Game loop
    // ------------------------------------------------------------------
    const clock = new THREE.Clock();

    function update(dt) {
      if (STATE.running) {
        STATE.speed = Math.min(
          CONFIG.maxSpeed,
          STATE.speed + CONFIG.speedRamp * dt
        );
        STATE.score += STATE.speed * dt * 0.6;
        scoreEl.textContent = String(Math.floor(STATE.score));
      }

      // Move world toward the camera by scrolling tiles
      const moveZ = STATE.running ? STATE.speed * dt : 0;

      // Recycle ground tiles
      for (const tile of tiles) {
        tile.position.z -= moveZ;
        if (tile.position.z < -CONFIG.tileSize * 1.5) {
          // Find max z among tiles, add tileSize
          let maxZ = -Infinity;
          for (const t of tiles) {
            if (t.position.z > maxZ) maxZ = t.position.z;
          }
          tile.position.z = maxZ + CONFIG.tileSize;
          // Refresh decorations
          if (tile.userData.decor) {
            tile.remove(tile.userData.decor);
            tile.userData.decor.traverse((o) => {
              if (o.geometry && !Object.values(sharedGeom).includes(o.geometry)) {
                o.geometry.dispose();
              }
            });
          }
          decorateTile(tile);
        }
      }

      // Recycle clouds
      clouds.children.forEach((c) => {
        c.position.z -= moveZ * 0.25;
        c.position.x += dt * 0.4;
        if (c.position.z < -60) {
          c.position.z += 240;
          c.position.x = (Math.random() - 0.5) * 200;
          c.position.y = 20 + Math.random() * 12;
        }
      });

      // Recycle distant mountains
      distant.children.forEach((m) => {
        m.position.z -= moveZ * 0.5;
        if (m.position.z < -40) {
          m.position.z += CONFIG.mountainCount * 14;
        }
      });

      // Dino jump physics
      if (STATE.running || STATE.gameOver) {
        STATE.vy += CONFIG.gravity * dt;
        dino.position.y += STATE.vy * dt;
        if (dino.position.y < 0) {
          dino.position.y = 0;
          STATE.vy = 0;
          STATE.jumpCount = 0;
        }
      }

      // Animate dino: running gait + tail wag, only when grounded
      if (STATE.running) STATE.runT += dt * (8 + STATE.speed * 0.15);
      const grounded = dino.position.y <= 0.001;
      const swing = Math.sin(STATE.runT);
      if (grounded && STATE.running) {
        legL.rotation.x = swing * 0.9;
        legR.rotation.x = -swing * 0.9;
        armL.rotation.x = -swing * 0.4;
        armR.rotation.x = swing * 0.4;
      } else if (!grounded) {
        // Tuck legs in air
        legL.rotation.x = THREE.MathUtils.lerp(legL.rotation.x, -0.6, 0.15);
        legR.rotation.x = THREE.MathUtils.lerp(legR.rotation.x, -0.6, 0.15);
      } else {
        legL.rotation.x = THREE.MathUtils.lerp(legL.rotation.x, 0, 0.2);
        legR.rotation.x = THREE.MathUtils.lerp(legR.rotation.x, 0, 0.2);
      }
      tail.rotation.y = Math.sin(STATE.runT * 0.5) * 0.35;
      head.rotation.x = -0.05 + Math.sin(STATE.runT * 0.5) * 0.05;
      // Subtle body bob
      body.position.y = 2.0 + (grounded && STATE.running ? Math.abs(swing) * 0.08 : 0);

      // Spawn obstacles
      if (STATE.running) {
        STATE.spawnTimer += dt;
        if (STATE.spawnTimer >= STATE.nextSpawn) {
          STATE.spawnTimer = 0;
          // Spawn 1, occasionally 2 close together
          spawnObstacle();
          if (Math.random() < 0.18) {
            const o = obstacles[obstacles.length - 1];
            o.position.z += 4 + Math.random() * 2;
            spawnObstacle();
          }
          // Faster game -> tighter spacing
          const t = THREE.MathUtils.clamp(
            (STATE.speed - CONFIG.startSpeed) /
              (CONFIG.maxSpeed - CONFIG.startSpeed),
            0,
            1
          );
          STATE.nextSpawn = THREE.MathUtils.lerp(
            CONFIG.obstacleSpawnMax,
            CONFIG.obstacleSpawnMin,
            t
          );
        }
      }

      // Move + cull obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.position.z -= moveZ;
        if (o.position.z < dino.position.z - 6) {
          scene.remove(o);
          obstacles.splice(i, 1);
        }
      }

      // Collision detection (cylinder approximation)
      if (STATE.running) {
        const dinoY = dino.position.y;
        for (const o of obstacles) {
          const dz = o.position.z - dino.position.z;
          if (Math.abs(dz) > 1.5) continue;
          const dx = o.position.x - dino.position.x;
          const radius = (o.userData.radius || 0.8) + 0.6;
          if (dx * dx + dz * dz < radius * radius) {
            // Vertical clearance check
            const obstacleTop = o.userData.height || 2.0;
            // Dino height ~3.4 starting at y=dinoY; if dinoY > obstacleTop - 0.4, it cleared.
            if (dinoY < obstacleTop - 0.4) {
              endGame();
              break;
            }
          }
        }
      }

      // Camera follow + tiny shake on death (3/4 side view)
      const tx = camRig.offsetX;
      const ty = camRig.offsetY + Math.min(dino.position.y * 0.12, 1.0);
      const tz = dino.position.z + camRig.offsetZ;
      camera.position.x += (tx - camera.position.x) * 0.1;
      camera.position.y += (ty - camera.position.y) * 0.08;
      camera.position.z += (tz - camera.position.z) * 0.15;
      if (STATE.cameraShake > 0) {
        camera.position.x += (Math.random() - 0.5) * STATE.cameraShake;
        camera.position.y += (Math.random() - 0.5) * STATE.cameraShake * 0.5;
        STATE.cameraShake *= 0.9;
        if (STATE.cameraShake < 0.02) STATE.cameraShake = 0;
      }
      camera.lookAt(
        dino.position.x,
        camRig.lookY + dino.position.y * 0.3,
        dino.position.z + camRig.lookAhead
      );

      // Sun follows along z
      sun.position.z = dino.position.z - 20;
      sun.target.position.z = dino.position.z + 5;
      sun.target.updateMatrixWorld();
    }

    function loop() {
      const dt = Math.min(clock.getDelta(), 1 / 30);
      update(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
